name: ingest

# The data pass. Runs against the production D1 and touches nothing else — the site itself is
# deployed separately, because a data refresh is not a code change and should not need one.
#
# Timed for 05:10 UTC: after the Sensor.Community archive has published the previous day (it lands
# around 03:30 UTC), so `history_days` is computed against a listing that exists.
on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Single stage to run (stations | comfort | divergence | gate). Empty runs all."
        required: false
        type: string

concurrency:
  # Two ingests writing the same rows would both succeed and one would win at random. Let the
  # running one finish rather than cancelling it halfway through a flush.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The full pass is ~20 minutes of mostly waiting on rate limits. The ceiling exists so a hung
    # upstream fails the run instead of burning an hour — the fetch timeouts should catch it first.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply any new migrations
        run: |
          for f in db/migrations/*.sql; do
            [ -e "$f" ] || continue
            echo "→ $f"
            # Migrations are written to be idempotent; a re-applied ALTER is a no-op error we
            # deliberately swallow so a rerun of this workflow is safe.
            pnpm exec wrangler d1 execute air-signal --remote --file "$f" --yes || true
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ingest
        run: |
          if [ -n "${{ inputs.stage }}" ]; then
            pnpm ingest -- --remote --only "${{ inputs.stage }}"
          else
            pnpm ingest -- --remote
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional. Without it the fire signal stays absent rather than being invented.
          FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}

      - name: Check the site did not shrink
        run: pnpm integration -- --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
